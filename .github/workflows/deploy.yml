name: Deploy to GitHub Pages

on:
  # Publish whenever main changes.
  push:
    branches: ["main"]
  # Check pull requests into main with the same lint, tests and build, without publishing.
  pull_request:
    branches: ["main"]
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a running deployment is never cancelled halfway.
# Pull request checks run in their own group, so they never block a release.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Builds the client, the server bundle, and prerenders every page,
      # the 404 page, the legacy redirects and sitemap.xml into dist/.
      - name: Build project
        run: npm run build
        env:
          VITE_DEMO_API_URL: ${{ secrets.VITE_DEMO_API_URL }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
